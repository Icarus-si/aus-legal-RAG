global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "prometheus_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "host.docker.internal:9093"

scrape_configs:
  - job_name: "aus-legal-rag"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8082"